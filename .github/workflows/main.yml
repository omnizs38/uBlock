name: uBO release

on:
  create:
    branches: master

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # for creating release
    name: Build packages
    runs-on: ubuntu-slim
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/')
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Clone repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Clone uAssets
        run: |
          tools/pull-assets.sh
      - name: Build MV2 packages
        run: |
          tools/make-chromium.sh "$VERSION"
          tools/make-firefox.sh "$VERSION"
      - name: Assemble release notes
        run: |
          > release.body.txt
          grep -m1 -B10000 -- "----------" CHANGELOG.md >> release.body.txt
          sed -e "s/%version%/$VERSION/g" .github/workflows/RELEASE.HEAD.md >> release.body.txt
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --title "$VERSION" \
            --prerelease \
            --draft \
            --notes-file release.body.txt
          gh release upload "$VERSION" \
            "dist/build/uBlock0_${VERSION}.chromium.zip" \
            "dist/build/uBlock0_${VERSION}.firefox.xpi"
